name: Windows release

# Builds, signs and packages a Windows release on demand. Signing uses Azure Trusted Signing when
# these repository secrets are set, and the run produces unsigned packages otherwise:
#
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET   a service principal allowed to sign
#   TRUSTED_SIGNING_ENDPOINT        e.g. https://weu.codesigning.azure.net
#   TRUSTED_SIGNING_ACCOUNT         the Trusted Signing account name
#   TRUSTED_SIGNING_PROFILE         the certificate profile name
#   TRUSTED_SIGNING_PUBLISHER       the certificate subject, for the MSIX manifest ("CN=…")
#
# With "publish" checked, the files are uploaded to the GitHub release for the version (created
# if the macOS script has not made it yet) and the winget manifests are attached as an artifact.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to the GitHub release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      HAS_SIGNING: ${{ secrets.TRUSTED_SIGNING_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@v0.5.0
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
      - name: SwiftTerm build information without git
        shell: pwsh
        run: ./scripts/swiftterm-build-info.ps1 -GitHubEnv

      - name: Trusted Signing client
        id: signing
        if: ${{ env.HAS_SIGNING == 'true' }}
        shell: pwsh
        env:
          ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        run: |
          nuget install Microsoft.Trusted.Signing.Client -OutputDirectory $env:RUNNER_TEMP\tsc -NonInteractive
          $dlib = Get-ChildItem $env:RUNNER_TEMP\tsc -Recurse -Filter Azure.CodeSigning.Dlib.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          @{ Endpoint = $env:ENDPOINT; CodeSigningAccountName = $env:ACCOUNT; CertificateProfileName = $env:PROFILE } |
            ConvertTo-Json | Set-Content -Encoding utf8 $env:RUNNER_TEMP\metadata.json
          "dlib=$($dlib.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "metadata=$env:RUNNER_TEMP\metadata.json" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Build, sign and package
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          GH_TOKEN: ${{ github.token }}
          PUBLISHER: ${{ secrets.TRUSTED_SIGNING_PUBLISHER }}
        run: |
          $params = @{ Arch = @("x64") ; Repo = "${{ github.repository }}" }
          if ("${{ steps.signing.outputs.metadata }}") {
            $params.TrustedSigning = "${{ steps.signing.outputs.metadata }}"
            $params.TrustedSigningDlib = "${{ steps.signing.outputs.dlib }}"
            $params.Publisher = $env:PUBLISHER
          } else {
            $params.SkipSign = $true
          }
          if ("${{ inputs.publish }}" -eq "true") { $params.Publish = $true }
          ./scripts/release-windows.ps1 @params

      - uses: actions/upload-artifact@v4
        with:
          name: termsie-windows-release
          path: |
            dist/windows/*.zip
            dist/windows/*.msix
            dist/windows/SHA256SUMS-windows.txt
            dist/windows/winget
          if-no-files-found: ignore
